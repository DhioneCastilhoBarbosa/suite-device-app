# Identidade estável — NÃO alterar (userData / SQLite dos clientes).
appId: com.electron.app
productName: suite-device-app
forceCodeSigning: false

directories:
  output: release
  buildResources: resources

files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - resources/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!config/*"
  - "!scripts/*"
  - "!*.config.{js,ts,cjs,mjs}"
  - "!{*.md,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,pnpm-lock.yaml,yarn.lock}"

asarUnpack:
  - dist/preload/**
  - resources/**

win:
  target:
    - nsis
  icon: icon.ico
  sign: null
  executableName: suite-device-app
  artifactName: ${productName} Setup ${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: null
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  shortcutName: Suite Device
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ${productName} Setup ${version}.${ext}

mac:
  target:
    - zip
    - dmg
  category: public.app-category.utilities
  icon: icon.png
  # Ad-hoc: electron-updater/ShipIt exige assinatura válida.
  # No CI, identity '-' pode não assinar (keychain vazio) — afterPack faz codesign -.
  identity: '-'
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

afterPack: scripts/after-pack-mac.cjs


linux:
  target:
    - AppImage
  category: Utility
  icon: icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

npmRebuild: false

# Primeiro publisher = o que fica embutido em app-update.yml (generic).
# Publicação no GitHub Releases (transição) ou no servidor próprio é feita pelos
# workflows / scripts — não pelo provider github do electron-builder.
publish:
  provider: generic
  url: ${env.UPDATE_SERVER_URL}
  channel: latest
