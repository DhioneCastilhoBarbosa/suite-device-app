appId: com.electron.app
productName: suite-device-app
forceCodeSigning: false

directories:
  buildResources: resources

files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - resources/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!*.config.{js,ts,cjs,mjs}"
  - "!{*.md,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,pnpm-lock.yaml,yarn.lock}"

asarUnpack:
  - dist/preload/**       # 🔥 Garante que o preload não fique no asar
  - resources/**          # 🔥 Se tiver recursos como imagens ou binários

win:
  target:
    - nsis
  # .ico com vários tamanhos — embutido no .exe (atalho da área de trabalho usa o ícone do exe)
  icon: icon.ico
  sign: null
  executableName: suite-device-app

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: null
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  shortcutName: Suite Device
  createDesktopShortcut: always
  createStartMenuShortcut: true

npmRebuild: false

publish:
  provider: github
  owner: DhioneCastilhoBarbosa
  repo: suite-device-app
  releaseType: release
  vPrefixedTagName: true
