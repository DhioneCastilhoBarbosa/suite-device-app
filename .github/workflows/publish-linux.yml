name: Publish Suite Device Linux (servidor)

# Espelha suite-update/publish-electron-test-linux.yml (slug suite-device-app).
# Disparo manual. Versão = package.json; staging → /staging; production → canal.
# Transição GitHub Releases: use publish-linux-github.yml.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      environment:
        description: staging publica em /staging (teste baixável); production libera no canal
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: publish-suite-device-linux-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Instalar e typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Preparar a versão do package.json
        id: release
        env:
          PUBLISH_CHANNEL: ${{ inputs.channel }}
          PUBLISH_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node scripts/prepare-release.cjs
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão que sobe: $VERSION (package.json)"

      - name: Gerar o AppImage
        env:
          PUBLISH_CHANNEL: ${{ inputs.channel }}
          PUBLISH_ENVIRONMENT: ${{ inputs.environment }}
          UPDATE_SERVER_URL: https://app-suite-update.dualbase.com.br/suite-device-app/${{ inputs.channel }}
          TELEMETRY_ENABLED: ${{ secrets.TELEMETRY_ENABLED }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}
          TELEMETRY_APPLICATION: suite-device-app
        run: |
          node scripts/validate-publish-inputs.cjs
          npm run build:linux
          test -f release/latest-linux.yml
          ls release/*.AppImage | grep -v '\.blockmap$' >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: suite-device-app-linux-${{ inputs.channel }}-${{ steps.release.outputs.version }}
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/latest-linux.yml
          if-no-files-found: error
          # Sem .blockmap o glob parcial ainda envia AppImage + yml (upload-artifact v4).

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: suite-device-app-linux-${{ inputs.channel }}-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Validar parâmetros e artefatos
        env:
          PUBLISH_CHANNEL: ${{ inputs.channel }}
          PUBLISH_ENVIRONMENT: ${{ inputs.environment }}
          PUBLISH_PARAMS_FILE: ${{ github.workspace }}/publish-params.env
        run: |
          node scripts/validate-publish-inputs.cjs
          echo "Publicando Linux versão ${{ needs.build.outputs.version }} do package.json"
          test -f artifacts/latest-linux.yml
          ls artifacts/*.AppImage >/dev/null
          # .AppImage.blockmap é opcional (mapa embutido no AppImage)

      - name: Enviar e publicar
        env:
          SUITE_UPDATE_SSH_HOST: ${{ secrets.SUITE_UPDATE_SSH_HOST }}
          SUITE_UPDATE_SSH_USER: ${{ secrets.SUITE_UPDATE_SSH_USER }}
          SUITE_UPDATE_SSH_KEY: ${{ secrets.SUITE_UPDATE_SSH_KEY }}
          SUITE_UPDATE_SSH_KNOWN_HOSTS: ${{ secrets.SUITE_UPDATE_SSH_KNOWN_HOSTS }}
          SUITE_UPDATE_VOLUME_PATH: ${{ secrets.SUITE_UPDATE_VOLUME_PATH }}
        run: |
          set -eu
          . ./publish-params.env
          test -n "$SUITE_UPDATE_SSH_HOST"
          test -n "$SUITE_UPDATE_SSH_USER"
          test -n "$SUITE_UPDATE_SSH_KEY"
          test -n "$SUITE_UPDATE_SSH_KNOWN_HOSTS"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SUITE_UPDATE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SUITE_UPDATE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

          volume="/var/lib/docker/volumes/suite_update_storage/_data"
          if [ -n "${SUITE_UPDATE_VOLUME_PATH:-}" ]; then
            printf '%s\n' "$SUITE_UPDATE_VOLUME_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'
            volume="$SUITE_UPDATE_VOLUME_PATH"
          fi

          mkdir -p staging-upload
          cp artifacts/latest-linux.yml staging-upload/
          # Só o instalador .AppImage (não o .blockmap, se existir).
          find artifacts -maxdepth 1 -type f -name '*.AppImage' ! -name '*.blockmap' -exec cp {} staging-upload/ \;
          if ls artifacts/*.AppImage.blockmap >/dev/null 2>&1; then
            cp artifacts/*.AppImage.blockmap staging-upload/
          fi

          remote="${SUITE_UPDATE_SSH_USER}@${SUITE_UPDATE_SSH_HOST}"
          staging="suite-update-incoming/${CHANNEL}-linux"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "mkdir -p ~/${staging} && chmod 700 ~/suite-update-incoming ~/${staging}"
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes staging-upload/* "$remote:~/${staging}/"
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes scripts/publish-remote.sh "$remote:~/${staging}/publish-remote.sh"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "SUITE_UPDATE_VOLUME_PATH=$(printf '%q' "$volume") SUITE_UPDATE_RELEASE_SOURCE=github sh ~/${staging}/publish-remote.sh '$CHANNEL' '$VERSION' '$MODE' ~/${staging} suite-device-app"

          if [ "$MODE" = "publish" ]; then
            feed_channel="$CHANNEL"
          else
            feed_channel="staging"
          fi
          # Fonte da verdade: arquivos no volume. Nginx/HTTPS podem atrasar.
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "test -f $(printf '%q' "$volume")/suite-device-app/${feed_channel}/latest-linux.yml && grep -q '^version: ${VERSION}$' $(printf '%q' "$volume")/suite-device-app/${feed_channel}/latest-linux.yml && echo volume-linux-ok"
          echo "ok  Linux ${VERSION} no volume suite-device-app/${feed_channel}/"
          if ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "curl -fsS http://127.0.0.1:8099/health >/dev/null && curl -fsS http://127.0.0.1:8099/suite-device-app/${feed_channel}/latest-linux.yml | grep -q '^version: ${VERSION}$'"; then
            echo "ok  Nginx local serve /suite-device-app/${feed_channel}/ (Linux)"
          else
            echo "aviso  Nginx local ainda não serve /staging Linux; arquivos já estão no volume para promover"
          fi
          for public in \
            "https://update.api-castilho.com.br/suite-device-app/${feed_channel}/latest-linux.yml" \
            "https://app-suite-update.dualbase.com.br/suite-device-app/${feed_channel}/latest-linux.yml"
          do
            if curl -fsS -L --retry 2 -A suite-update-validate/1.0 "$public" | grep -q "^version: ${VERSION}$"; then
              echo "ok  público: $public"
            else
              echo "aviso  ainda não no HTTPS ($public) — confira DNS/Traefik do domínio do painel"
            fi
          done
          if [ "$MODE" = "stage" ]; then
            echo "ok  staging Linux pronto; no painel use Promover → ${CHANNEL} quando validar"
          fi
